#
# Every push to master and every pull request.
#
# The builds run in distribution containers, because the Ubuntu runners do
# not ship KF6: Debian 13 carries the oldest supported KF6 and Qt, Fedora 44
# the newest.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: REUSE compliance
        run: pipx run reuse lint
      - name: Scripts are executable
        run: |
          # Every tracked file with a #! line must be committed as 100755.
          bad=0
          while IFS= read -r file; do
            mode="$(git ls-files -s -- "$file" | cut -d' ' -f1)"
            if [ "$mode" != 100755 ]; then
              echo "::error file=$file::has a #! line but is committed as $mode, not 100755"
              bad=1
            fi
          done < <(git ls-files | while IFS= read -r f; do
            [ -f "$f" ] && head -c2 "$f" | grep -q '^#!' && echo "$f"
          done)
          exit "$bad"
      - name: shellcheck
        run: git ls-files -z -- '*.sh' | xargs -0 shellcheck
      - name: Translations compile
        run: |
          sudo apt-get install -y --no-install-recommends gettext
          for po in po/*/*.po; do msgfmt --check -o /dev/null "$po"; done

  build:
    name: build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: docker.io/library/debian:13
            family: debian
          - name: Fedora 44
            image: registry.fedoraproject.org/fedora:44
            family: fedora
            format: true
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      # Before the checkout, so that it gets a real git history, which the
      # build takes its version from.
      - name: Install build dependencies (Debian)
        if: matrix.family == 'debian'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ gettext extra-cmake-modules \
            qt6-base-dev libkf6i18n-dev appstream dbus-daemon
      - name: Install build dependencies (Fedora)
        if: matrix.family == 'fedora'
        run: |
          dnf install -y git cmake ninja-build gcc-c++ gettext extra-cmake-modules \
            'cmake(Qt6Core)' 'cmake(Qt6DBus)' 'cmake(Qt6Test)' 'cmake(KF6I18n)' \
            appstream dbus-daemon clang-tools-extra
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure
        run: |
          git config --global --add safe.directory "$PWD"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install into a scratch prefix
        run: DESTDIR="$PWD/staging" cmake --install build
      - name: Code style (clang-format, KDE style from ECM)
        if: matrix.format
        run: |
          # .clang-format was generated by the configure step.
          git ls-files -z -- '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror
